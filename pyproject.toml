[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tomlml"
version = "0.1.0"
description = "Physics-grounded transistor-operation energy measurement and prediction for machine learning workloads (TOML)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muntaser Syed", email = "jemsbhai@gmail.com" }]
keywords = ["energy", "power", "gpu", "nvml", "machine learning", "reinforcement learning", "efficiency"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
# torch is intentionally not listed: the CUDA wheel index must be chosen per
# platform (see README.md, Setup). The reference build is torch 2.6.0+cu124.
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14",
  "pyyaml>=6.0",
  "nvidia-ml-py>=12.560",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5"]
ml = ["scikit-learn>=1.5,<2", "pandas>=2.2,<3"]

[project.urls]
Repository = "https://github.com/jemsbhai/mlpowermeter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "gpu: requires a CUDA device and NVML (deselect with '-m \"not gpu\"')",
]
