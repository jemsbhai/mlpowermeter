# EXP-002: exact low-rank crossover, dense versus factorized GEMM (inference).
# Pre-registered in LOGBOOK.md (EXP-002); STUDY_DESIGN.md H2a and H3c;
# protocol D-010. Full run about 8.5 hours per platform. --quick uses the
# quick_grid below (about 2 minutes) and is a pipeline check only.

experiment_id: EXP-002
name: lowrank-crossover
experiment: exp_002_lowrank_crossover
phase: pilot

grid:
  shapes: [512, 1024, 2048, 4096]          # d_in = d_out = d
  rank_fractions: [0.015625, 0.03125, 0.0625, 0.125, 0.25, 0.375, 0.5, 0.75]
  batches: [1, 4, 16, 64, 256, 1024, 4096]
  realizations: [dense, factorized]
  reps: 3
  calibration_shapes: [512, 2048]
  heldout_shapes: [1024, 4096]

quick_grid:                                # replaces grid under --quick
  shapes: [512, 1024]
  rank_fractions: [0.0625, 0.25, 0.5]
  batches: [1, 64, 4096]
  realizations: [dense, factorized]
  reps: 2
  calibration_shapes: [512]
  heldout_shapes: [1024]

workload:
  dtype: float32
  allow_tf32: false
  data_seed: 1234
  weight_cycling_l2_multiple: 2            # D-010 item 5: K = ceil(2 L2 / (4 d^2))
  exactness_tolerance_rel_frobenius: 1.0e-4   # D-010 item 6

measurement:
  window_s: 20                             # D-010 item 1; quick runs scale it by the quick factor
  warmup_s: 2                              # same-configuration warmup before every window
  settle_load:                             # thermal settle under a mid-grid load before each shape's sequence
    rank_fraction: 0.25
    batch: 256
    realization: dense
  thermal_settle_threshold_c: 1.0
  thermal_settle_window_s: 5.0
  thermal_settle_timeout_s: 300
  census_warmup_calls: 5                   # D-010 item 4

analysis:
  models: [P0, M1, M2]
  selection: leave_one_cell_out            # over calibration (d, B) cells only
  bootstrap_resamples: 1000
  bootstrap_seed_component: bootstrap

criteria:
  version: 3                               # v3 (D-012): applies to runs submitted after 2026-09-18 (A100). The laptop run
                                           # 20260915T180708 was evaluated under v2 (its frozen config.yaml).
  heldout_median_ape_max: 0.20             # E1: selected linear model (M1 or M2)
  crossover_coverage_rule: point           # E2 (v3): measured and predicted r* within a factor of crossover_point_factor_max,
                                           # same verdict kind; interval overlap reported alongside
  crossover_coverage_min_cells: 12         # E2, of 14 held-out (d, B) cells
  crossover_point_factor_max: 1.5
  b1_rank_fraction_max: 0.25               # E3: r* at B = 1 at most d/4 (or dense wins throughout), model on the same side
  b1_gap_shapes: [1024]                    # E3 (v3): dispatch-relevant shape only; at 4096 the B=1 map is memory-bound (E10)
  monotonicity_spearman_min: 0.7           # E4 (v3): threshold set from the laptop's 0.79 at d = 1024
  monotonicity_shapes: [1024]              # E4 (v3): at 4096 r*(B) is flat near d/2 by mechanism; reported, not gated
  exactness_max_excluded_fraction: 0.05    # E5
  regret_max: 0.05                         # E6 (reported, not gating)
  contaminated_windows_max: 0              # E7
  implausible_power_fraction_max: 0.01     # E7
  m3:                                      # D-012: registered for runs after the laptop's (A100, EXP-003)
    crossover_point_hits_min: 12           # E8: M3 crossover within a factor of point_factor of measured, 12 of 14 held-out cells
    point_factor: 1.5
    b1_small_d_fraction_max: 0.30          # E10: measured r*(B=1)/d at the smallest held-out shape (1024)
    b1_large_d_fraction_min: 0.45          # E10: measured r*(B=1)/d at the largest held-out shape (4096)
